# Deploy frontend to S3 + invalidate CloudFront
# Triggered on pushes to main that touch the frontend/ directory.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID         — from infrastructure/github-actions-setup.sh
#   AWS_SECRET_ACCESS_KEY     — from infrastructure/github-actions-setup.sh
#   AWS_REGION                — us-west-2
#   S3_BUCKET                 — reb-frontend-902917582511
#   CLOUDFRONT_DISTRIBUTION_ID — E2DTZE7SXRJQ4F

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://8p2oc737d9.execute-api.us-west-2.amazonaws.com/prod
          VITE_COGNITO_USER_POOL_ID: us-west-2_67E39NjQ1
          VITE_COGNITO_CLIENT_ID: 79lon5asqe452blgqk2nh0gl1s
          VITE_AWS_REGION: us-west-2
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync assets (long-lived cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

      - name: Sync HTML (no-cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --cache-control "no-cache" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
