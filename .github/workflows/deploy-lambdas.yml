# Deploy Lambda functions on push to main
# Each Lambda is only redeployed when its source files change.
#
# Required GitHub Secrets (same as deploy.yml):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION

name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'backend/ai/**'
      - 'backend/auth/**'
      - 'backend/listings/**'

jobs:
  deploy-ai:
    if: contains(github.event.head_commit.modified, 'backend/ai/') || contains(github.event.head_commit.added, 'backend/ai/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install AI Lambda dependencies
        working-directory: backend/ai
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and deploy reb-ai-scoring
        working-directory: backend/ai
        run: |
          zip -r /tmp/ai.zip . --exclude "*.sh" --exclude ".env*"
          aws lambda update-function-code \
            --function-name reb-ai-scoring \
            --zip-file fileb:///tmp/ai.zip \
            --region us-west-2
          aws lambda wait function-updated \
            --function-name reb-ai-scoring \
            --region us-west-2

  deploy-auth:
    if: contains(github.event.head_commit.modified, 'backend/auth/handler.mjs') || contains(github.event.head_commit.added, 'backend/auth/handler.mjs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and deploy reb-auth-handler
        working-directory: backend/auth
        run: |
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/auth.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('handler.mjs')
          "
          aws lambda update-function-code \
            --function-name reb-auth-handler \
            --zip-file fileb:///tmp/auth.zip \
            --region us-west-2
          aws lambda wait function-updated \
            --function-name reb-auth-handler \
            --region us-west-2

  deploy-listings:
    if: contains(github.event.head_commit.modified, 'backend/listings/') || contains(github.event.head_commit.added, 'backend/listings/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package and deploy reb-listings-handler
        working-directory: backend/listings
        run: |
          python3 -c "
          import zipfile
          with zipfile.ZipFile('/tmp/listings.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('handler.mjs')
          "
          aws lambda update-function-code \
            --function-name reb-listings-handler \
            --zip-file fileb:///tmp/listings.zip \
            --region us-west-2
          aws lambda wait function-updated \
            --function-name reb-listings-handler \
            --region us-west-2
